services:
  postgres:
    image: postgres:16-alpine
    container_name: lis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: label_inspection_identity_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d label_inspection_identity_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: lis-client
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=label_inspection_identity_dev;Username=postgres;Password=postgres
      InspectionMl__BaseUrl: ${INSPECTION_ML_BASE_URL:-http://host.docker.internal:8000}
      InspectionMl__PublicAppBaseUrl: ${INSPECTION_PUBLIC_APP_BASE_URL:-http://localhost:7107}
      InspectionMl__ApiKey: ${INSPECTION_ML_API_KEY:-61564072594301516938052184223075}
      InspectionMl__WebhookSecret: ${INSPECTION_WEBHOOK_SECRET:-61564072594301516938052184223075}
    ports:
      - "7107:8080"
    volumes:
      - ./client/App_Data:/app/App_Data

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: lis-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: postgres
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
